<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="tab.runes">Руни</title>
  <script src="i18n.js"></script>
  <style>
    :root {
      --parchment: #f4e0b6;
      --panel: #f8e9c8;
      --ink: #2f2413;
      --gold: #d4a017;
      --gold-bright: #f4d27a;
      --frame: #b38f50;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--parchment);
      color: var(--ink);
    }

    .page {
      display: flex;
      gap: 20px;
      padding: 16px;
      min-height: 100vh;
    }

    .hero-pane,
    .rune-pane {
      border: 1px solid var(--frame);
      background: var(--panel);
      border-radius: 10px;
    }

    .hero-pane {
      flex: 0 0 260px;
      padding: 18px 20px 24px;
    }

    .rune-pane {
      flex: 1 1 auto;
      padding: 18px 20px;
      min-width: 0;
    }

    .pane-title {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 700;
    }

    .rune-mode {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
    }

    .mode-btn {
      border: 1px solid var(--frame);
      background: #fff4de;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .mode-btn.is-active {
      background: var(--frame);
      color: #fff;
    }

    .fon_hero {
      position: relative;
      width: 200px;
      height: 324px;
      margin: 0 auto;
      background: url("image/_big2.jpg?410") no-repeat;
      background-position: -664px 0;
    }

    .shmotka {
      position: absolute;
      box-sizing: content-box;
      width: 50px;
      height: 50px;
      padding: 0;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .shmotka:hover {
      border-color: rgba(244, 210, 122, 0.85);
      box-shadow: 0 0 0 2px rgba(244, 210, 122, 0.55);
    }

    .shmotka.is-active {
      z-index: 2;
      border-color: var(--gold-bright);
      box-shadow:
        0 0 0 2px var(--gold-bright),
        0 0 14px rgba(212, 160, 23, 0.95);
    }

    /* Same slot map as the battle calculator paperdoll */
    .shmotka-0  { top: 6px;   left: 75px; }
    .shmotka-1  { top: 49px;  left: 5px; }
    .shmotka-2  { top: 180px; left: 5px; }
    .shmotka-3  { top: 246px; left: 5px; }
    .shmotka-4  { top: 72px;  left: 75px; }
    .shmotka-5  { top: 137px; left: 75px; }
    .shmotka-6  { top: 269px; left: 75px; }
    .shmotka-7  { top: 82px;  left: 145px; }
    .shmotka-8  { top: 213px; left: 145px; }
    .shmotka-9  { top: 114px; left: 5px; }
    .shmotka-10 { top: 203px; left: 75px; }
    .shmotka-11 { top: 147px; left: 145px; }

    .rune-placeholder {
      color: #6b572e;
      line-height: 1.5;
    }

    .combo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 4px 16px;
    }

    .combo-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid #d2b57a;
      border-radius: 8px;
      background: #fff4de;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .combo-list.has-selection .combo-card {
      transform: scale(0.94);
      opacity: 0.7;
    }

    .combo-list.has-selection .combo-card.is-selected {
      transform: scale(1.08);
      opacity: 1;
      z-index: 1;
      border-color: var(--gold-bright);
      box-shadow:
        0 0 0 2px var(--gold-bright),
        0 0 16px rgba(212, 160, 23, 0.85);
    }

    .combo-num {
      flex: 0 0 28px;
      font-weight: 700;
      color: #7a5a22;
    }

    .combo-runes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 220px;
    }

    .combo-rune {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #111;
      border-radius: 6px;
    }

    .combo-plus {
      color: #7a5a22;
      font-weight: 700;
    }

    .combo-effect {
      flex: 1 1 200px;
      font-weight: 600;
      line-height: 1.4;
    }

    .combo-effect-line + .combo-effect-line {
      margin-top: 4px;
    }

    .effect-enemy {
      color: #c62828;
    }

    .effect-self {
      color: #2e7d32;
    }

    .effect-ally {
      color: #c9a000;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero-pane">
      <h1 class="pane-title" data-i18n="runes.hero">Герой</h1>
      <div class="fon_hero" id="hero-paperdoll">
        <button type="button" class="shmotka shmotka-0" data-slot="0" data-i18n-title="slot.helmet" title="Шолом" aria-label="Шолом"></button>
        <button type="button" class="shmotka shmotka-1" data-slot="necklace" data-i18n-title="slot.necklace" title="Намисто" aria-label="Намисто"></button>
        <button type="button" class="shmotka shmotka-3" data-slot="weapon" data-i18n-title="slot.weapon" title="Зброя" aria-label="Зброя"></button>
        <button type="button" class="shmotka shmotka-4" data-slot="armor" data-i18n-title="slot.armor" title="Броня" aria-label="Броня"></button>
        <button type="button" class="shmotka shmotka-8" data-slot="shield" data-i18n-title="slot.shield" title="Щит" aria-label="Щит"></button>
        <button type="button" class="shmotka shmotka-2" data-slot="ring" data-i18n-title="slot.ring" title="Кільце" aria-label="Кільце"></button>
        <button type="button" class="shmotka shmotka-5" data-slot="belt" data-i18n-title="slot.belt" title="Пояс" aria-label="Пояс"></button>
        <button type="button" class="shmotka shmotka-6" data-slot="boots" data-i18n-title="slot.boots" title="Черевики" aria-label="Черевики"></button>
        <button type="button" class="shmotka shmotka-11" data-slot="cloak" data-i18n-title="slot.cloak" title="Плащ" aria-label="Плащ"></button>
        <button type="button" class="shmotka shmotka-9" data-slot="bracers" data-i18n-title="slot.bracers" title="Наручі" aria-label="Наручі"></button>
        <button type="button" class="shmotka shmotka-10" data-slot="greaves" data-i18n-title="slot.greaves" title="Поножі" aria-label="Поножі"></button>
        <button type="button" class="shmotka shmotka-7" data-slot="backpack" data-i18n-title="slot.backpack" title="Заплечна сумка" aria-label="Заплечна сумка"></button>
      </div>
    </section>

    <section class="rune-pane">
      <h1 class="pane-title" id="rune-title" data-i18n="runes.title">Комбінації рун</h1>
      <div class="rune-mode" role="tablist" data-i18n-title="runes.type" aria-label="Тип рун">
        <button type="button" class="mode-btn is-active" data-mode="normal" data-i18n="runes.regular">Звичайні</button>
        <button type="button" class="mode-btn" data-mode="ancient" data-i18n="runes.ancient">Античні</button>
      </div>
      <div id="rune-content">
        <p class="rune-placeholder" data-i18n="runes.pickSlot">Оберіть слот зліва, щоб побачити комбінації рун.</p>
      </div>
    </section>
  </div>

  <script>

    const RUNES = {

    const SLOT_COMBOS = {

        { runes: ["thorn", "rad", "tyr", "gifu"], effects: [{ text: "+2400 науки на годину", target: "self" }] },
        { runes: ["feo", "feo", "feo"], effects: [{ text: "+1200 максимальної мани", target: "self" }] },
        { runes: ["gifu", "yar"], effects: [{ text: "+3600 максимальної мани", target: "self" }] }
      ],
      necklace: [
        { runes: ["feo", "thorn"], effects: [{ text: "Атака всіх військ (діє на противника) -7%", target: "enemy" }] },
        { runes: ["feo", "io", "rad", "rad"], effects: [{ text: "Атака всіх військ (діє на противника) -12%", target: "enemy" }] },
        { runes: ["gifu", "hegl", "hegl"], effects: [{ text: "Атака всіх військ (діє на противника) -18%", target: "enemy" }] }
      ],
      backpack: [
        { runes: ["ur", "ur"], effects: [{ text: "Регенерація мани героя +120 / год", target: "self" }] },
        { runes: ["feo", "feo", "feo", "thorn"], effects: [{ text: "Регенерація мани героя +240 / год", target: "self" }] },
        { runes: ["io", "tyr"], effects: [{ text: "Регенерація мани героя +360 / год", target: "self" }] }
      ],
      ring: [
        { runes: ["feo", "ur"], effects: [{ text: "Шанс провалу ворожого закляття 18%", target: "enemy" }] },
        { runes: ["feo", "feo", "feo", "tyr"], effects: [{ text: "Шанс провалу ворожого закляття 36%", target: "enemy" }] },
        { runes: ["io", "yar"], effects: [{ text: "Шанс провалу ворожого закляття 54%", target: "enemy" }] }
      ],
      armor: [
        { runes: ["ur", "ur", "thorn"], effects: [{ text: "Здоров'я всіх військ (діє на противника) -12%", target: "enemy" }] },
        { runes: ["ur", "ur", "io", "rad"], effects: [{ text: "Здоров'я всіх військ (діє на противника) -24%", target: "enemy" }] },
        { runes: ["feo", "yar", "hegl"], effects: [{ text: "Здоров'я всіх військ (діє на противника) -36%", target: "enemy" }] },
        { runes: ["feo", "feo", "feo", "feo"], effects: [{ text: "Здоров'я всіх військ +18%", target: "self" }] },
        { runes: ["thorn", "thorn", "rad"], effects: [{ text: "Здоров'я всіх військ +36%", target: "self" }] },
        { runes: ["gifu", "yar", "hegl"], effects: [{ text: "Здоров'я всіх військ +54%", target: "self" }] },
        { runes: ["gifu", "yar", "yar", "yar", "hegl"], effects: [
          { text: "Здоров'я всіх військ (діє на себе) +55%", target: "self" },
          { text: "Атака всіх військ (діє на противника) -12%", target: "enemy" }
        ] }
      ],

        { runes: ["thorn", "rad", "tyr"], effects: [{ text: "Шанс знайти магічний предмет +120%", target: "self" }] }
      ],
      weapon: [
        { runes: ["feo", "feo", "feo", "ur"], effects: [{ text: "Атака всіх військ +18%", target: "self" }] },
        { runes: ["feo", "io", "rad"], effects: [{ text: "Атака всіх військ +36%", target: "self" }] },
        { runes: ["thorn", "thorn", "tyr", "yar"], effects: [{ text: "Атака всіх військ +54%", target: "self" }] },
        { runes: ["feo", "feo", "ur", "ur"], effects: [{ text: "Шанс пошкодити кожну будівлю +30%", target: "enemy" }] },
        { runes: ["feo", "ur", "thorn", "io"], effects: [{ text: "Шанс пошкодити кожну будівлю +60%", target: "enemy" }] }
      ],
      shield: [
        { runes: ["feo", "ur", "ur"], effects: [{ text: "Захист усіх військ +12", target: "self" }] },
        { runes: ["thorn", "io", "io"], effects: [{ text: "Захист усіх військ +24", target: "self" }] },
        { runes: ["feo", "rad", "rad", "tyr"], effects: [{ text: "Захист усіх військ +36", target: "self" }] },
        { runes: ["ur", "ur", "ur", "ur"], effects: [{ text: "Межа максимального захисту +7", target: "self" }] },
        { runes: ["thorn", "io", "tyr"], effects: [{ text: "Межа максимального захисту +12", target: "self" }] },

      ],
      boots: [
        { runes: ["ur", "io", "rad"], effects: [{ text: "Вартість відправки місій з військами (жалування всіх військ) -12%", target: "self" }] },
        { runes: ["thorn", "rad", "tyr", "yar"], effects: [{ text: "Вартість відправки місій з військами (жалування всіх військ) -24%", target: "self" }] },
        { runes: ["tyr", "gifu", "gifu", "hegl"], effects: [{ text: "Вартість відправки місій з військами (жалування всіх військ) -36%", target: "self" }] }
      ],
      bracers: [
        { runes: ["feo", "rad", "yar"], effects: [{ text: "Атака всіх військ (діє на себе і союзника) +18%", target: "ally" }] }
      ],
      greaves: [
        { runes: ["feo", "feo", "feo", "io"], effects: [{ text: "Здоров'я всіх військ (діє на себе і союзника) +12%", target: "ally" }] },
        { runes: ["tyr", "yar", "hegl", "hegl"], effects: [{ text: "Здоров'я всіх військ (діє на себе і союзника) +36%", target: "ally" }] }
      ],
      cloak: [
        { runes: ["feo", "ur", "ur", "thorn"], effects: [{ text: "Отримувані ресурси при грабунку монстрів +12%", target: "self" }] },
        { runes: ["feo", "thorn", "rad", "rad"], effects: [{ text: "Отримувані ресурси при грабунку монстрів +24%", target: "self" }] }
      ]
    };

    const ANCIENT_COMBOS = {
      necklace: [
        { runes: ["rad", "tyr", "yar"], effects: [
          { text: "Максимальна мана +3500", target: "self" },
          { text: "Регенерація мани героя +250 / год", target: "self" }
        ] }
      ],
      backpack: [
        { runes: ["ur", "yar"], effects: [
          { text: "Параметри науки «Спостереження» +4", target: "self" },
          { text: "Параметри науки «Шпигунство» +4", target: "self" }
        ] }
      ],
      ring: [
        { runes: ["gifu", "yar"], effects: [
          { text: "Шанс провалу ворожого закляття +60%", target: "enemy" },
          { text: "Атака магічним вежам +12%", target: "self" }
        ] }
      ],
      armor: [
        { runes: ["io", "yar", "yar", "yar", "hegl"], effects: [
          { text: "Межа максимального захисту +36", target: "self" },
          { text: "Здоров'я всіх військ (діє на противника) -24%", target: "enemy" }
        ] }
      ],
      belt: [
        { runes: ["ur", "gifu"], effects: [
          { text: "Місткість сумки героя +12", target: "self" },
          { text: "Вивчення лабораторіями алхіміків +12%", target: "self" }
        ] },
        { runes: ["feo", "thorn", "yar"], effects: [
          { text: "Шанс знайти магічний предмет у руїні +240%", target: "self" },
          { text: "Отримуваний героєм досвід у бою +240%", target: "self" }
        ] }
      ],
      weapon: [
        { runes: ["feo", "rad", "gifu", "hegl"], effects: [
          { text: "Атака всіх військ собі і союзнику +36%", target: "ally" },
          { text: "Здоров'я всіх військ (діє на противника) -24%", target: "enemy" }
        ] }
      ],
      shield: [
        { runes: ["thorn", "io", "yar", "yar"], effects: [
          { text: "Захист усіх військ собі і союзнику +30", target: "ally" },
          { text: "Атака магічних веж (діє на противника) -12%", target: "enemy" }
        ] }
      ],
      boots: [
        { runes: ["tyr", "yar"], effects: [
          { text: "Тривалість місії загону героя -12%", target: "self" },
          { text: "Вартість відправки місій з військами -12%", target: "self" }
        ] },
        { runes: ["thorn", "rad", "gifu", "yar"], effects: [
          { text: "Тривалість вхідних атак (діє на противника) +36%", target: "enemy" },
          { text: "Дальність заклять +6", target: "self" }
        ] }
      ],
      bracers: [
        { runes: ["tyr", "gifu"], effects: [
          { text: "Посилення атаки армії +24%", target: "self" },
          { text: "Атака переслідувачів +36%", target: "self" }
        ] }
      ],
      greaves: [
        { runes: ["feo", "io", "yar", "hegl"], effects: [
          { text: "Межа максимального захисту собі і союзнику +18", target: "ally" }
        ] }
      ],
      cloak: [
        { runes: ["tyr", "tyr", "tyr"], effects: [
          { text: "Отримувані ресурси при грабунку в руїні +48%", target: "self" },
          { text: "Отримуваний героєм досвід у бою +120%", target: "self" }
        ] }
      ]
    };

    const slots = document.querySelectorAll(".shmotka");
    const modeButtons = document.querySelectorAll(".mode-btn");
    const title = document.getElementById("rune-title");
    const content = document.getElementById("rune-content");
    let runeMode = "normal";
    let activeSlot = null;
    const SLOT_I18N = {
      "0": "slot.helmet",
      necklace: "slot.necklace",
      weapon: "slot.weapon",
      armor: "slot.armor",
      shield: "slot.shield",
      ring: "slot.ring",
      belt: "slot.belt",
      boots: "slot.boots",
      cloak: "slot.cloak",
      bracers: "slot.bracers",
      greaves: "slot.greaves",
      backpack: "slot.backpack"
    };

    function t(key) {
      return window.MLI18N ? MLI18N.t(key) : key;
    }

    function tEffect(text) {
      return window.MLI18N ? MLI18N.tEffect(text) : text;
    }

    function slotName(slot) {
      return t(SLOT_I18N[slot.dataset.slot] || slot.dataset.slot);
    }

    function showEmpty() {
      title.textContent = t(runeMode === "ancient" ? "runes.titleAncient" : "runes.title");
      content.innerHTML = '<p class="rune-placeholder">' + t("runes.pickSlot") + "</p>";
    }

    function runeImg(key) {
      const rune = RUNES[key];
      const file = runeMode === "ancient" ? rune.ancientId : rune.id;
      const label = (runeMode === "ancient" ? t("runes.ancientPrefix") : "") + rune.name;
      return (
        '<img class="combo-rune" src="' + RUNE_ICON + file + '.png" alt="' + label + '" title="' + label + '">'
      );
    }

    function effectLines(combo) {
      return combo.effects.map(function (item) {
        return '<div class="combo-effect-line effect-' + item.target + '">' + tEffect(item.text) + '</div>';
      }).join("");
    }

    function currentCombos(slotId) {
      return runeMode === "ancient" ? ANCIENT_COMBOS[slotId] : SLOT_COMBOS[slotId];
    }

    function showCombos(name, combos) {
      title.textContent = t(runeMode === "ancient" ? "runes.titleAncientSlot" : "runes.titleSlot") + name;

      if (!combos || !combos.length) {
        content.innerHTML = '<p class="rune-placeholder">' + t("runes.later") + "</p>";
        return;
      }

      const cards = combos.map(function (combo, index) {
        const icons = combo.runes.map(runeImg).join('<span class="combo-plus">+</span>');
        return (
          '<article class="combo-card" data-combo="' + index + '" role="button" tabindex="0">' +
            '<div class="combo-num">' + (index + 1) + '</div>' +
            '<div class="combo-runes">' + icons + '</div>' +
            '<div class="combo-effect">' + effectLines(combo) + '</div>' +
          '</article>'
        );
      }).join("");

      content.innerHTML = '<div class="combo-list">' + cards + '</div>';
      bindComboSelection(content.querySelector(".combo-list"));
    }

    function bindComboSelection(list) {
      if (!list) {
        return;
      }

      list.querySelectorAll(".combo-card").forEach((card) => {
        card.addEventListener("click", () => {
          const alreadySelected = card.classList.contains("is-selected");

          list.querySelectorAll(".combo-card").forEach((item) => item.classList.remove("is-selected"));

          if (alreadySelected) {
            list.classList.remove("has-selection");
            return;
          }

          card.classList.add("is-selected");
          list.classList.add("has-selection");
        });
      });
    }

    slots.forEach((slot) => {
      slot.addEventListener("click", () => {
        const alreadyActive = slot.classList.contains("is-active");

        slots.forEach((item) => item.classList.remove("is-active"));

        if (alreadyActive) {
          activeSlot = null;
          showEmpty();
          return;
        }

        slot.classList.add("is-active");
        activeSlot = slot;
        showCombos(slotName(slot), currentCombos(slot.dataset.slot));
      });
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        runeMode = button.dataset.mode;
        modeButtons.forEach((item) => item.classList.toggle("is-active", item === button));
        refreshActiveSlot();
      });
    });

    function refreshActiveSlot() {
      if (!activeSlot) {
        showEmpty();
        return;
      }

      showCombos(slotName(activeSlot), currentCombos(activeSlot.dataset.slot));
    }

    if (window.MLI18N) {
      MLI18N.onChange = refreshActiveSlot;
    }
  </script>
</body>
</html>
