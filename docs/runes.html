<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="tab.runes">Руни</title>
  <script src="i18n.js"></script>
  <style>
    :root {
      --parchment: #f4e0b6;
      --panel: #f8e9c8;
      --ink: #2f2413;
      --gold: #d4a017;
      --gold-bright: #f4d27a;
      --frame: #b38f50;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--parchment);
      color: var(--ink);
    }

    .layout {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      height: 100%;
    }

    .page {
      display: flex;
      align-items: stretch;
      gap: 20px;
      padding: 16px;
      box-sizing: border-box;
      flex: 1 1 auto;
      min-height: 0;
    }

    .hero-pane,
    .rune-pane {
      border: 1px solid var(--frame);
      background: var(--panel);
      border-radius: 10px;
    }

    .hero-pane {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 16px 14px;
    }

    .hero-bonuses {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--frame);
    }

    .hero-bonuses[hidden] {
      display: none;
    }

    .hero-bonuses-title {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .rune-pane {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 18px 20px;
    }

    #rune-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .pane-title {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 700;
    }

    .rune-mode {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
    }

    .mode-btn {
      border: 1px solid var(--frame);
      background: #fff4de;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .mode-btn.is-active {
      background: var(--frame);
      color: #fff;
    }

    .fon_hero {
      position: relative;
      flex: 0 0 auto;
      width: 200px;
      height: 324px;
      margin: 0 auto;
      overflow: hidden;
      background: url("image/_big2.jpg?410") no-repeat;
      background-position: -664px 0;
    }

    .shmotka {
      position: absolute;
      box-sizing: content-box;
      width: 50px;
      height: 50px;
      padding: 0;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .shmotka:hover {
      border-color: rgba(244, 210, 122, 0.85);
      box-shadow: 0 0 0 2px rgba(244, 210, 122, 0.55);
    }

    .shmotka.is-active {
      z-index: 2;
      border-color: var(--gold-bright);
      box-shadow:
        0 0 0 2px var(--gold-bright),
        0 0 14px rgba(212, 160, 23, 0.95);
    }

    .shmotka.has-runes {
      background: rgba(17, 12, 6, 0.32);
    }

    .slot-runes {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .slot-rune {
      position: absolute;
      width: 16px;
      height: 16px;
      object-fit: contain;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 0 0 1px rgba(244, 210, 122, 0.4);
    }

    .slot-rune.pos-0 { top: 1px; left: 1px; }
    .slot-rune.pos-1 { top: 1px; right: 1px; }
    .slot-rune.pos-2 { bottom: 1px; right: 1px; }
    .slot-rune.pos-3 { bottom: 1px; left: 1px; }
    .slot-rune.pos-4 {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* Same slot map as the battle calculator paperdoll */
    .shmotka-0  { top: 6px;   left: 75px; }
    .shmotka-1  { top: 49px;  left: 5px; }
    .shmotka-2  { top: 180px; left: 5px; }
    .shmotka-3  { top: 246px; left: 5px; }
    .shmotka-4  { top: 72px;  left: 75px; }
    .shmotka-5  { top: 137px; left: 75px; }
    .shmotka-6  { top: 269px; left: 75px; }
    .shmotka-7  { top: 82px;  left: 145px; }
    .shmotka-8  { top: 213px; left: 145px; }
    .shmotka-9  { top: 114px; left: 5px; }
    .shmotka-10 { top: 203px; left: 75px; }
    .shmotka-11 { top: 147px; left: 145px; }

    .rune-placeholder {
      color: #6b572e;
      line-height: 1.5;
    }

    .rune-builder[hidden] {
      display: none;
    }

    .rune-builder {
      flex: 0 0 auto;
      margin: 0 0 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--frame);
    }

    .builder-title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .builder-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px 20px;
    }

    .rune-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1 1 200px;
      min-width: 0;
    }

    .palette-rune {
      box-sizing: border-box;
      width: 52px;
      height: 52px;
      padding: 2px;
      border: 1px solid var(--frame);
      border-radius: 8px;
      background: #111;
      cursor: pointer;
    }

    .palette-rune img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .palette-rune:hover:not(:disabled) {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 2px rgba(244, 210, 122, 0.55);
    }

    .palette-rune:disabled {
      opacity: 0.38;
      cursor: default;
    }

    .rune-draft-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      margin-top: 0;
    }

    .rune-draft {
      display: flex;
      gap: 6px;
    }

    .draft-rune,
    .draft-empty {
      box-sizing: border-box;
      width: 48px;
      height: 48px;
      border-radius: 6px;
    }

    .draft-empty {
      border: 1px dashed #c4a36a;
      background: rgba(255, 244, 222, 0.45);
    }

    .draft-rune {
      padding: 0;
      border: 1px solid var(--frame);
      background: #111;
      cursor: pointer;
    }

    .draft-rune img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .draft-rune:hover {
      border-color: #c62828;
    }

    .draft-clear {
      border: 1px solid var(--frame);
      background: #fff4de;
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .draft-clear[hidden] {
      display: none;
    }

    .combo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 4px 16px;
    }

    .combo-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid #d2b57a;
      border-radius: 8px;
      background: #fff4de;
      cursor: pointer;
      transition: opacity 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .combo-list.has-selection .combo-card {
      opacity: 0.38;
      filter: grayscale(0.25);
    }

    .combo-list.has-selection .combo-card.is-selected {
      opacity: 1;
      filter: none;
      z-index: 1;
      border-color: var(--gold-bright);
      box-shadow:
        0 0 0 2px var(--gold-bright),
        0 0 16px rgba(212, 160, 23, 0.85);
    }

    .combo-num {
      flex: 0 0 28px;
      font-weight: 700;
      color: #7a5a22;
    }

    .combo-runes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 220px;
    }

    .combo-rune {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #111;
      border-radius: 6px;
    }

    .combo-plus {
      color: #7a5a22;
      font-weight: 700;
    }

    .combo-effect {
      flex: 1 1 200px;
      font-weight: 600;
      line-height: 1.4;
    }

    .combo-effect-line + .combo-effect-line {
      margin-top: 4px;
    }

    .effect-enemy {
      color: #c62828;
    }

    .effect-self {
      color: #2e7d32;
    }

    .effect-ally {
      color: #c9a000;
    }

    .rune-bonuses:empty {
      display: none;
    }

    .rune-bonuses {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--frame);
    }

    .rune-bonuses h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .rune-bonus-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
    }

    .rune-bonus-name {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .summary-pane {
      flex: 0 0 auto;
      max-height: 28vh;
      overflow: auto;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--frame);
    }

    .summary-pane[hidden] {
      display: none;
    }

    .summary-title {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .summary-rune-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      overflow-x: auto;
    }

    .summary-rune {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      gap: 4px;
      min-width: 56px;
      padding: 6px 8px 8px;
      border: 1px solid #d2b57a;
      border-radius: 10px;
      background: #fff4de;
      font-size: 16px;
      font-weight: 700;
    }

    .summary-rune img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #111;
      border-radius: 6px;
    }

    .summary-stat {
      padding: 7px 0;
      border-bottom: 1px solid rgba(179, 143, 80, 0.35);
    }

    .summary-stat-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .summary-stat-main span:first-child {
      line-height: 1.3;
    }

    .summary-stat-break {
      margin-top: 2px;
      font-size: 11px;
      color: #6b572e;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="layout">
  <div class="page">
    <section class="hero-pane">
      <h1 class="pane-title" data-i18n="runes.hero">Герой</h1>
      <div class="fon_hero" id="hero-paperdoll">
        <button type="button" class="shmotka shmotka-0" data-slot="0" data-i18n-title="slot.helmet" title="Шолом" aria-label="Шолом"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-1" data-slot="necklace" data-i18n-title="slot.necklace" title="Намисто" aria-label="Намисто"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-3" data-slot="weapon" data-i18n-title="slot.weapon" title="Зброя" aria-label="Зброя"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-4" data-slot="armor" data-i18n-title="slot.armor" title="Броня" aria-label="Броня"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-8" data-slot="shield" data-i18n-title="slot.shield" title="Щит" aria-label="Щит"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-2" data-slot="ring" data-i18n-title="slot.ring" title="Кільце" aria-label="Кільце"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-5" data-slot="belt" data-i18n-title="slot.belt" title="Пояс" aria-label="Пояс"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-6" data-slot="boots" data-i18n-title="slot.boots" title="Черевики" aria-label="Черевики"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-11" data-slot="cloak" data-i18n-title="slot.cloak" title="Плащ" aria-label="Плащ"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-9" data-slot="bracers" data-i18n-title="slot.bracers" title="Наручі" aria-label="Наручі"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-10" data-slot="greaves" data-i18n-title="slot.greaves" title="Поножі" aria-label="Поножі"><span class="slot-runes" aria-hidden="true"></span></button>
        <button type="button" class="shmotka shmotka-7" data-slot="backpack" data-i18n-title="slot.backpack" title="Заплечна сумка" aria-label="Заплечна сумка"><span class="slot-runes" aria-hidden="true"></span></button>
      </div>
      <div id="hero-bonuses" class="hero-bonuses" hidden></div>
    </section>

    <section class="rune-pane">
      <h1 class="pane-title" id="rune-title" data-i18n="runes.title">Комбінації рун</h1>
      <div class="rune-mode" role="tablist" data-i18n-title="runes.type" aria-label="Тип рун">
        <button type="button" class="mode-btn is-active" data-mode="normal" data-i18n="runes.regular">Звичайні</button>
        <button type="button" class="mode-btn" data-mode="ancient" data-i18n="runes.ancient">Античні</button>
      </div>
      <div id="rune-builder" class="rune-builder" hidden>
        <h2 class="builder-title" data-i18n="runes.build">Створити комбінацію</h2>
        <div class="builder-row">
          <div class="rune-palette" id="rune-palette"></div>
          <div class="rune-draft-row">
            <div class="rune-draft" id="rune-draft"></div>
            <button type="button" class="draft-clear" id="rune-draft-clear" hidden data-i18n="runes.clearDraft">Очистити</button>
          </div>
        </div>
      </div>
      <div id="rune-content">
        <p class="rune-placeholder" data-i18n="runes.pickSlot">Оберіть слот зліва, щоб побачити комбінації рун.</p>
      </div>
      <section class="summary-pane" id="rune-summary" hidden></section>
    </section>
  </div>
  </div>

  <script>
    const RUNE_ICON = "wp-content/assets/shared/artifacts/rune/";

    const RUNES = {
      feo: { id: "f", ancientId: "fp", name: "Фео" },
      ur: { id: "u", ancientId: "up", name: "Ур" },

      shield: [

        { runes: ["ur", "ur", "ur"], effects: [{ text: "Атака магічних веж (діє на противника) -7%", target: "enemy" }] },
        { runes: ["feo", "feo", "rad", "tyr"], effects: [{ text: "Атака магічних веж (діє на противника) -12%", target: "enemy" }] }

    function t(key) {
      return window.MLI18N ? MLI18N.t(key) : key;
    }

      return window.MLI18N ? MLI18N.tEffect(text) : text;

    }

    function runeLabel(key, mode) {
      return (mode === "ancient" ? t("runes.ancientPrefix") : "") + t("rune." + key);
    }

    function runeFile(key, mode) {
      const rune = RUNES[key];
      return RUNE_ICON + (mode === "ancient" ? rune.ancientId : rune.id) + ".png";
    }

    function showEmpty() {
      title.textContent = t(runeMode === "ancient" ? "runes.titleAncient" : "runes.title");

      renderBuilder();
      renderSummary();
    }

    function runeSignature(runes) {
      return (runes || []).slice().sort().join(",");
    }

    function findComboIndex(slotId, mode, runes) {
      const combos = combosFor(slotId, mode) || [];
      const sig = runeSignature(runes);
      if (!sig) {
        return -1;
      }
      for (let i = 0; i < combos.length; i++) {
        if (runeSignature(combos[i].runes) === sig) {
          return i;
        }
      }
      return -1;
    }

    function currentSlotRunes() {
      if (!activeSlot) {
        return [];
      }
      const sel = slotSelections[activeSlot.dataset.slot];
      if (!sel || sel.mode !== runeMode) {
        return [];
      }
      return (sel.runes || []).slice();
    }

    function runeImg(key) {
      const label = runeLabel(key, runeMode);
      return (
        '<img class="combo-rune" src="' + runeFile(key, runeMode) + '" alt="' + label + '" title="' + label + '">'
      );
    }

    function effectLines(combo) {
      return combo.effects.map(function (item) {
        return '<div class="combo-effect-line effect-' + item.target + '">' + tEffect(item.text) + '</div>';
      }).join("");
    }

    function currentCombos(slotId) {
      return runeMode === "ancient" ? ANCIENT_COMBOS[slotId] : SLOT_COMBOS[slotId];
    }

    function combosFor(slotId, mode) {
      return mode === "ancient" ? ANCIENT_COMBOS[slotId] : SLOT_COMBOS[slotId];
    }

    function selectedIndexFor(slotId) {
      const sel = slotSelections[slotId];
      if (!sel || sel.mode !== runeMode) {
        return -1;
      }
      return sel.index;
    }

    function renderSlotRunes(slotId) {
      const slot = document.querySelector('.shmotka[data-slot="' + slotId + '"]');
      if (!slot) {
        return;
      }

      const holder = slot.querySelector(".slot-runes");
      const sel = slotSelections[slotId];
      const runes = sel && sel.runes && sel.runes.length ? sel.runes : null;

      if (!holder) {
        return;
      }

      if (!runes) {
        holder.innerHTML = "";
        slot.classList.remove("has-runes");
        return;
      }

      holder.innerHTML = runes.map(function (key, index) {
        const label = runeLabel(key, sel.mode);
        return (
          '<img class="slot-rune pos-' + index + '" src="' + runeFile(key, sel.mode) + '" alt="' + label + '" title="' + label + '">'
        );
      }).join("");
      slot.classList.add("has-runes");
    }

    function scaleBonusText(text, times) {
      return text.replace(/([+\-−])(\d+)/, function (_, sign, num) {
        const value = Number(num) * times;
        return (sign === "-" || sign === "−" ? "−" : "+") + value;
      });
    }

    function soloBonusRows(runes, mode) {
      const order = [];
      const count = {};

      runes.forEach(function (key) {
        if (!count[key]) {
          order.push(key);
          count[key] = 0;
        }
        count[key] += 1;
      });

      return order.map(function (key) {
        const n = count[key];
        const name = runeLabel(key, mode) + (n > 1 ? " ×" + n : "");
        const bonusKey = mode === "ancient" ? "runeBonus.ancient." + key : "runeBonus." + key;
        const target = ENEMY_RUNES[key] ? "enemy" : "self";
        return (
          '<div class="rune-bonus-row">' +
            '<img class="combo-rune" src="' + runeFile(key, mode) + '" alt="' + name + '">' +
            '<div>' +
              '<div class="rune-bonus-name">' + name + '</div>' +
              '<div class="combo-effect-line effect-' + target + '">' + scaleBonusText(t(bonusKey), n) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

      if (!box || !activeSlot) {
        return;
      }

      const slotId = activeSlot.dataset.slot;
      const sel = slotSelections[slotId];
      const runes = sel && sel.mode === runeMode ? sel.runes : null;

      if (!runes || !runes.length) {
        box.innerHTML = "";
        return;
      }

      box.innerHTML = "<h2>" + t("runes.soloBonuses") + "</h2>" + soloBonusRows(runes, sel.mode);
    }

    function applyListSelection(list, slotId) {
      const selected = selectedIndexFor(slotId);
      const sel = slotSelections[slotId];
      const hasCustom = sel && sel.mode === runeMode && sel.runes && sel.runes.length && selected < 0;
      list.querySelectorAll(".combo-card").forEach(function (item) {
        item.classList.toggle("is-selected", Number(item.dataset.combo) === selected);
      });
      list.classList.toggle("has-selection", selected >= 0 || hasCustom);
      if (selected >= 0) {
        const card = list.querySelector('.combo-card.is-selected');
        if (card && card.scrollIntoView) {
          card.scrollIntoView({ block: "nearest" });
        }
      }
      renderBonusPanel();
    }

    function showCombos(name, combos) {
      title.textContent = t(runeMode === "ancient" ? "runes.titleAncientSlot" : "runes.titleSlot") + name;
      renderBuilder();

      if (!combos || !combos.length) {
        content.innerHTML = '<p class="rune-placeholder">' + t("runes.later") + '</p><div id="rune-bonuses" class="rune-bonuses"></div>';
        renderBonusPanel();
        return;
      }

      const cards = combos.map(function (combo, index) {
        const icons = combo.runes.map(runeImg).join('<span class="combo-plus">+</span>');
        return (
          '<article class="combo-card" data-combo="' + index + '" role="button" tabindex="0">' +
            '<div class="combo-num">' + (index + 1) + '</div>' +
            '<div class="combo-runes">' + icons + '</div>' +
            '<div class="combo-effect">' + effectLines(combo) + '</div>' +
          '</article>'
        );
      }).join("");

      content.innerHTML = '<div class="combo-list">' + cards + '</div><div id="rune-bonuses" class="rune-bonuses"></div>';
      const list = content.querySelector(".combo-list");
      bindComboSelection(list);
      applyListSelection(list, activeSlot.dataset.slot);
    }

    function bindComboSelection(list) {
      if (!list || !activeSlot) {
        return;
      }

      list.querySelectorAll(".combo-card").forEach(function (card) {
        function choose() {
          const index = Number(card.dataset.combo);
          const slotId = activeSlot.dataset.slot;
          const sel = slotSelections[slotId];
          const alreadySelected = sel && sel.mode === runeMode && sel.index === index;
          const combo = currentCombos(slotId)[index];

          if (alreadySelected) {
            setActiveRunes([]);
            return;
          }

          setActiveRunes((combo && combo.runes) || []);
        }

        card.addEventListener("click", choose);
        card.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            choose();
          }
        });
      });
    }

    function addPart(bucket, stat, amount, part) {
      if (!bucket[stat]) {
        bucket[stat] = { combo: 0, solo: 0 };
      }
      bucket[stat][part] += amount;
    }

    function collectTotals() {
      const runeCounts = {};
      const totals = {};

      Object.keys(slotSelections).forEach(function (slotId) {
        const sel = slotSelections[slotId];
        if (!sel || !sel.runes || !sel.runes.length) {
          return;
        }

        sel.runes.forEach(function (key) {
          const id = key + "|" + sel.mode;
          runeCounts[id] = (runeCounts[id] || 0) + 1;
          const solo = RUNE_SOLO_STATS[sel.mode] && RUNE_SOLO_STATS[sel.mode][key];
          if (solo) {
            addPart(totals, solo.stat, solo.amount, "solo");
          }
        });

        if (sel.index >= 0) {
          const combos = combosFor(slotId, sel.mode) || [];
          const combo = combos[sel.index];
          if (combo && combo.effects) {
            combo.effects.forEach(function (effect) {
              const parts = EFFECT_STATS[effect.text] || [];
              parts.forEach(function (item) {
                addPart(totals, item.stat, item.amount, "combo");
              });
            });
          }
        }
      });

      return { runeCounts: runeCounts, totals: totals };
    }

    function formatAmount(amount, unit) {
      const sign = amount > 0 ? "+" : "−";
      const abs = Math.abs(amount);
      if (unit === "percent") {
        return sign + abs + "%";
      }
      if (unit === "perHour") {
        return sign + abs + " / " + t("runes.perHour");
      }
      return sign + abs;
    }

    function renderSummary() {
      const data = collectTotals();
      const runeItems = [];

      ["normal", "ancient"].forEach(function (mode) {
        RUNE_KEYS.forEach(function (key) {
          const n = data.runeCounts[key + "|" + mode] || 0;
          if (!n) {
            return;
          }
          const label = runeLabel(key, mode);
          runeItems.push(
            '<div class="summary-rune" title="' + label + '">' +
              '<img src="' + runeFile(key, mode) + '" alt="' + label + '">' +
              "<span>×" + n + "</span>" +
            "</div>"
          );
        });
      });

      const statItems = [];
      STAT_ORDER.forEach(function (stat) {
        const row = data.totals[stat];
        if (!row) {
          return;
        }
        const total = row.combo + row.solo;
        if (!total) {
          return;
        }
        const meta = STAT_META[stat] || { unit: "flat", target: "self" };
        let extra = "";
        if (row.combo && row.solo) {
          extra =
            '<div class="summary-stat-break">' +
              t("runes.fromCombo") + " " + formatAmount(row.combo, meta.unit) +
              " · " + t("runes.fromSolo") + " " + formatAmount(row.solo, meta.unit) +
            "</div>";
        }
        statItems.push(
          '<div class="summary-stat">' +
            '<div class="summary-stat-main">' +
              '<span class="effect-' + meta.target + '">' + t("stat." + stat) + "</span>" +
              '<span class="effect-' + meta.target + '">' + formatAmount(total, meta.unit) + "</span>" +
            "</div>" + extra +
          "</div>"
        );
      });

      if (summary) {
        if (!runeItems.length) {
          summary.innerHTML = "";
          summary.hidden = true;
        } else {
          summary.hidden = false;
          summary.innerHTML =
            '<h2 class="summary-title">' + t("runes.summaryRunes") + "</h2>" +
            '<div class="summary-rune-list">' + runeItems.join("") + "</div>";
        }
      }

      if (heroBonuses) {
        if (!statItems.length) {
          heroBonuses.innerHTML = "";
          heroBonuses.hidden = true;
        } else {
          heroBonuses.hidden = false;
          heroBonuses.innerHTML =
            '<h2 class="hero-bonuses-title">' + t("runes.summaryBonuses") + "</h2>" +
            statItems.join("");
        }
      }
    }

    function setActiveRunes(runes) {
      if (!activeSlot) {
        return;
      }

      const slotId = activeSlot.dataset.slot;
      if (!runes.length) {
        delete slotSelections[slotId];
      } else {
        slotSelections[slotId] = {
          mode: runeMode,
          index: findComboIndex(slotId, runeMode, runes),
          runes: runes.slice()
        };
      }

      renderSlotRunes(slotId);
      renderBuilder();
      const list = content.querySelector(".combo-list");
      if (list) {
        applyListSelection(list, slotId);
      } else {
        renderBonusPanel();
      }
      renderSummary();
    }

    function renderBuilder() {
      if (!builder) {
        return;
      }

      if (!activeSlot) {
        builder.hidden = true;
        return;
      }

      builder.hidden = false;
      const runes = currentSlotRunes();
      const full = runes.length >= 5;

      palette.innerHTML = RUNE_KEYS.map(function (key) {
        const label = runeLabel(key, runeMode);
        return (
          '<button type="button" class="palette-rune" data-rune="' + key + '"' +
            (full ? " disabled" : "") +
            ' title="' + label + '" aria-label="' + label + '">' +
            '<img src="' + runeFile(key, runeMode) + '" alt="' + label + '">' +
          "</button>"
        );
      }).join("");

      let draftHtml = "";
      for (let i = 0; i < 5; i++) {
        const key = runes[i];
        if (key) {
          const label = runeLabel(key, runeMode);
          draftHtml +=
            '<button type="button" class="draft-rune" data-index="' + i + '" title="' + t("runes.removeRune") + '" aria-label="' + t("runes.removeRune") + '">' +
              '<img src="' + runeFile(key, runeMode) + '" alt="' + label + '">' +
            "</button>";
        } else {
          draftHtml += '<span class="draft-empty"></span>';
        }
      }
      draft.innerHTML = draftHtml;
      draftClear.hidden = runes.length === 0;
    }

    slots.forEach((slot) => {
      slot.addEventListener("click", () => {
        const alreadyActive = slot.classList.contains("is-active");

        slots.forEach((item) => item.classList.remove("is-active"));

        if (alreadyActive) {
          activeSlot = null;
          showEmpty();
          return;
        }

        slot.classList.add("is-active");
        activeSlot = slot;
        showCombos(slotName(slot), currentCombos(slot.dataset.slot));
      });
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        runeMode = button.dataset.mode;
        modeButtons.forEach((item) => item.classList.toggle("is-active", item === button));
        refreshActiveSlot();
      });
    });

    function refreshActiveSlot() {
      if (!activeSlot) {
        showEmpty();
        return;
      }

      showCombos(slotName(activeSlot), currentCombos(activeSlot.dataset.slot));
      renderSummary();
    }

    palette.addEventListener("click", function (event) {
      const button = event.target.closest("[data-rune]");
      if (!button || button.disabled || !activeSlot) {
        return;
      }
      const runes = currentSlotRunes();
      if (runes.length >= 5) {
        return;
      }
      runes.push(button.getAttribute("data-rune"));
      setActiveRunes(runes);
    });

    draft.addEventListener("click", function (event) {
      const button = event.target.closest("[data-index]");
      if (!button || !activeSlot) {
        return;
      }
      const runes = currentSlotRunes();
      runes.splice(Number(button.getAttribute("data-index")), 1);
      setActiveRunes(runes);
    });

    draftClear.addEventListener("click", function () {
      setActiveRunes([]);
    });

    if (window.MLI18N) {
      MLI18N.onChange = refreshActiveSlot;
    }

    renderSummary();
  </script>
</body>
</html>
