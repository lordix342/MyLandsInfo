<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Руни</title>
  <style>
    :root {
      --parchment: #f4e0b6;
      --panel: #f8e9c8;
      --ink: #2f2413;
      --gold: #d4a017;
      --gold-bright: #f4d27a;
      --frame: #b38f50;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--parchment);
      color: var(--ink);
    }

    .page {
      display: flex;
      gap: 20px;
      padding: 16px;
      min-height: 100vh;
    }

    .hero-pane,
    .rune-pane {
      border: 1px solid var(--frame);
      background: var(--panel);
      border-radius: 10px;
    }

    .hero-pane {
      flex: 0 0 260px;
      padding: 18px 20px 24px;
    }

    .rune-pane {
      flex: 1 1 auto;
      padding: 18px 20px;
      min-width: 0;
    }

    .pane-title {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 700;
    }

    .fon_hero {
      position: relative;
      width: 200px;
      height: 324px;
      margin: 0 auto;
      background: url("image/_big2.jpg?410") no-repeat;
      background-position: -664px 0;
    }

    .shmotka {
      position: absolute;
      box-sizing: content-box;
      width: 50px;
      height: 50px;
      padding: 0;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .shmotka:hover {
      border-color: rgba(244, 210, 122, 0.85);
      box-shadow: 0 0 0 2px rgba(244, 210, 122, 0.55);
    }

    .shmotka.is-active {
      z-index: 2;
      border-color: var(--gold-bright);
      box-shadow:
        0 0 0 2px var(--gold-bright),
        0 0 14px rgba(212, 160, 23, 0.95);
    }

    /* Same slot map as the battle calculator paperdoll */
    .shmotka-0  { top: 6px;   left: 75px; }
    .shmotka-1  { top: 49px;  left: 5px; }
    .shmotka-2  { top: 180px; left: 5px; }
    .shmotka-3  { top: 246px; left: 5px; }
    .shmotka-4  { top: 72px;  left: 75px; }
    .shmotka-5  { top: 137px; left: 75px; }
    .shmotka-6  { top: 269px; left: 75px; }
    .shmotka-7  { top: 82px;  left: 145px; }
    .shmotka-8  { top: 213px; left: 145px; }
    .shmotka-9  { top: 114px; left: 5px; }
    .shmotka-10 { top: 203px; left: 75px; }
    .shmotka-11 { top: 147px; left: 145px; }

    .rune-placeholder {
      color: #6b572e;
      line-height: 1.5;
    }

    .combo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .combo-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid #d2b57a;
      border-radius: 8px;
      background: #fff4de;
    }

    .combo-num {
      flex: 0 0 28px;
      font-weight: 700;
      color: #7a5a22;
    }

    .combo-runes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 220px;
    }

    .combo-rune {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #111;
      border-radius: 6px;
    }

    .combo-plus {
      color: #7a5a22;
      font-weight: 700;
    }

    .combo-effect {
      flex: 1 1 200px;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero-pane">
      <h1 class="pane-title">Герой</h1>
      <div class="fon_hero" id="hero-paperdoll">
        <button type="button" class="shmotka shmotka-0" data-slot="0" title="Шолом" aria-label="Шолом"></button>
        <button type="button" class="shmotka shmotka-1" data-slot="1" title="Зброя" aria-label="Зброя"></button>
        <button type="button" class="shmotka shmotka-2" data-slot="2" title="Щит" aria-label="Щит"></button>
        <button type="button" class="shmotka shmotka-3" data-slot="3" title="Броня" aria-label="Броня"></button>
        <button type="button" class="shmotka shmotka-4" data-slot="4" title="Намисто" aria-label="Намисто"></button>
        <button type="button" class="shmotka shmotka-5" data-slot="5" title="Пояс" aria-label="Пояс"></button>
        <button type="button" class="shmotka shmotka-6" data-slot="6" title="Черевики" aria-label="Черевики"></button>
        <button type="button" class="shmotka shmotka-7" data-slot="7" title="Плащ" aria-label="Плащ"></button>
        <button type="button" class="shmotka shmotka-8" data-slot="8" title="Кільце" aria-label="Кільце"></button>
        <button type="button" class="shmotka shmotka-9" data-slot="9" title="Наручі" aria-label="Наручі"></button>
        <button type="button" class="shmotka shmotka-10" data-slot="10" title="Предмет" aria-label="Предмет"></button>
        <button type="button" class="shmotka shmotka-11" data-slot="11" title="Кільце 2" aria-label="Кільце 2"></button>
      </div>
    </section>

    <section class="rune-pane">
      <h1 class="pane-title" id="rune-title">Комбінації рун</h1>
      <div id="rune-content">
        <p class="rune-placeholder">Оберіть слот зліва, щоб побачити комбінації рун.</p>
      </div>
    </section>
  </div>

  <script>
    const RUNE_ICON = "wp-content/assets/shared/artifacts/rune/";

    const RUNES = {
      feo: { id: "f", name: "Фео" },
      ur: { id: "u", name: "Ур" },
      thorn: { id: "th", name: "Торн" },
      io: { id: "eo", name: "Ио" },
      rad: { id: "r", name: "Рад" },
      tyr: { id: "t", name: "Тир" },
      gifu: { id: "x", name: "Гифу" },
      yar: { id: "ia", name: "Йар" },
      hegl: { id: "h", name: "Хегль" }
    };

    const SLOT_COMBOS = {
      0: [
        { runes: ["feo", "ur", "thorn"], effect: "Жах 12%" },
        { runes: ["rad", "gifu"], effect: "Жах 24%" },
        { runes: ["ur", "thorn"], effect: "+700 науки на годину" },
        { runes: ["thorn", "thorn", "thorn"], effect: "+1200 науки на годину" },
        { runes: ["thorn", "rad", "tyr", "gifu"], effect: "+2400 науки на годину" },
        { runes: ["feo", "feo", "feo"], effect: "+1200 максимальної мани" },
        { runes: ["gifu", "yar"], effect: "+3600 максимальної мани" }
      ]
    };

    const slots = document.querySelectorAll(".shmotka");
    const title = document.getElementById("rune-title");
    const content = document.getElementById("rune-content");

    function showEmpty() {
      title.textContent = "Комбінації рун";
      content.innerHTML = '<p class="rune-placeholder">Оберіть слот зліва, щоб побачити комбінації рун.</p>';
    }

    function runeImg(key) {
      const rune = RUNES[key];
      return (
        '<img class="combo-rune" src="' + RUNE_ICON + rune.id + '.png" alt="' + rune.name + '" title="' + rune.name + '">'
      );
    }

    function showCombos(slotName, combos) {
      title.textContent = "Комбінації рун — " + slotName;

      if (!combos || !combos.length) {
        content.innerHTML = '<p class="rune-placeholder">Комбінації для цього слота з’являться пізніше.</p>';
        return;
      }

      const cards = combos.map(function (combo, index) {
        const icons = combo.runes.map(runeImg).join('<span class="combo-plus">+</span>');
        return (
          '<article class="combo-card">' +
            '<div class="combo-num">' + (index + 1) + '</div>' +
            '<div class="combo-runes">' + icons + '</div>' +
            '<div class="combo-effect">' + combo.effect + '</div>' +
          '</article>'
        );
      }).join("");

      content.innerHTML = '<div class="combo-list">' + cards + '</div>';
    }

    slots.forEach((slot) => {
      slot.addEventListener("click", () => {
        const alreadyActive = slot.classList.contains("is-active");

        slots.forEach((item) => item.classList.remove("is-active"));

        if (alreadyActive) {
          showEmpty();
          return;
        }

        slot.classList.add("is-active");
        showCombos(slot.title, SLOT_COMBOS[slot.dataset.slot]);
      });
    });
  </script>
</body>
</html>
